name: Automated Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        run: bunx --bun vite build

      - name: Copy dist folder via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist"
          target: "~/press.openrockets.com"

      - name: Pull Code and Restart Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export PATH="$HOME/.bun/bin:$PATH"
            cd ~/press.openrockets.com
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            ~/.bun/bin/bun install --production
            ~/.bun/bin/bunx drizzle-kit push || echo "Drizzle push failed or not needed"
            pm2 restart openrockets-press || pm2 start server/index.ts --name openrockets-press --interpreter ~/.bun/bin/bun

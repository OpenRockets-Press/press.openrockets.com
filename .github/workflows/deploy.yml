name: Automated Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        run: bunx --bun vite build

      - name: Clean Remote Dist Folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm -rf ~/press.openrockets.com/dist

      - name: Copy dist folder via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist"
          target: "~/press.openrockets.com"

      - name: Pull Code and Restart Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"
            cd ~/press.openrockets.com
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            bun install --production
            bun x drizzle-kit push || echo "Drizzle push failed or not needed"
            
            # Use PM2 absolute path if needed, but ssh-action usually finds it
            BUN_PATH=$(which bun || echo "$HOME/.bun/bin/bun")
            PM2_PATH=$(which pm2 || echo "pm2")
            
            # Clean up the duplicate process we created by mistake
            $PM2_PATH delete openrockets-press || true
            
            # Restart the correct process using the ecosystem config
            $PM2_PATH restart ecosystem.config.cjs --update-env || $PM2_PATH start ecosystem.config.cjs

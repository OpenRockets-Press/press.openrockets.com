name: Automated Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export PATH=$PATH:~/.bun/bin:/usr/local/bin
            cd ~/press.openrockets.com
            git pull origin main
            ~/.bun/bin/bunx --bun vite build
            pm2 restart openrockets-press

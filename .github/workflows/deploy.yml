name: Automated Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        run: bunx --bun vite build

      - name: Deploy via Native SSH and SCP
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          echo "Updating backend code first..."
          ssh $USER@$HOST "
            cd ~/press.openrockets.com
            git fetch origin main
            git reset --hard origin/main || true
            git clean -fd || true
          "
          
          echo "Cleaning remote dist folder..."
          ssh $USER@$HOST "rm -rf ~/press.openrockets.com/dist || true"
          
          echo "Uploading new dist folder..."
          scp -r dist $USER@$HOST:~/press.openrockets.com/
          
          echo "Restarting backend..."
          ssh $USER@$HOST "
            export PATH=\"\$HOME/.bun/bin:/usr/local/bin:\$PATH\"
            cd ~/press.openrockets.com
            bun install --production
            bun x drizzle-kit push || echo 'Drizzle push failed or not needed'
            
            # Restart using ecosystem.config.cjs to guarantee correct PM2 environment and cwd
            BUN_PATH=\$(which bun || echo \"\$HOME/.bun/bin/bun\")
            PM2_PATH=\$(which pm2 || echo \"pm2\")
            
            \$PM2_PATH restart ecosystem.config.cjs --update-env || \$PM2_PATH start ecosystem.config.cjs
          "

name: Migrate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "migrations/**"

jobs:
  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bun run migrate:strict
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          APPWRITE_BUCKET_PUB_FILES: ${{ secrets.APPWRITE_BUCKET_PUB_FILES }}
          APPWRITE_BUCKET_PUB_COVERS: ${{ secrets.APPWRITE_BUCKET_PUB_COVERS }}
          APPWRITE_BUCKET_CASE_ATTACHMENTS: ${{ secrets.APPWRITE_BUCKET_CASE_ATTACHMENTS }}

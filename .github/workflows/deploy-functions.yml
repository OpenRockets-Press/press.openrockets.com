name: Deploy Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "appwrite.json"

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    name: Upload to Appwrite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Deploy functions via Appwrite API
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
        run: bun migrations/migrate.mjs --no-db --no-buckets

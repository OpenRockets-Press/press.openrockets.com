<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/brand/9283527.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Open Rockets Press is a youth-led publication platform protecting intellectual property with compliant publishing workflows."
    />
    <title>OpenRockets Press</title>
    <script>
      (() => {
        const doNotTrack =
          navigator.doNotTrack === "1" ||
          window.doNotTrack === "1" ||
          navigator.globalPrivacyControl === true;

        if (doNotTrack) return;

        const script = document.createElement("script");
        script.defer = true;
        script.dataset.domain = "press.openrockets.com";
        script.src = "https://plausible.io/js/script.outbound-links.js";
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
